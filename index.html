<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optimization Galaxy</title>
<meta name="description" content="One live record per stone. Three companies, shared evidence, and the filing that lets the parcel move. Cut planning trained on 300,292 Galaxy scans and 2M Advisor operations.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/workspace.css">
</head>
<body class="og-app">

<header class="og-appbar">
  <div class="og-appbar__brand">
    <svg class="og-appbar__mark" viewBox="0 0 24 24" fill="none" aria-hidden="true" width="22" height="22">
      <path d="M12 3.2L19.2 9.4L12 20.8L4.8 9.4L12 3.2Z" stroke="currentColor" stroke-width="1.4" fill="none"/>
      <path d="M4.8 9.4H19.2M12 3.2L9.1 9.4L12 20.8M12 3.2L14.9 9.4L12 20.8" stroke="currentColor" stroke-width="0.7"/>
    </svg>
    <span class="og-appbar__product">Optimization&nbsp;Galaxy</span>
  </div>

  <div class="og-appbar__record" id="record-chip">
    <span class="og-appbar__record-name" id="record-name">No shipment open</span>
    <span class="og-appbar__record-id og-badge og-badge--mono" id="record-id">&mdash;</span>
  </div>

  <div class="og-appbar__spacer"></div>

  <div class="og-appbar__actions">
    <div class="og-field app-field-inline" title="Everything on screen is what this company is allowed to see">
      <label class="og-label og-t-11 og-upper og-c-tertiary" for="viewing-as">Viewing as</label>
      <select class="og-select og-select--sm" id="viewing-as">
        <option value="factory">Factory</option>
        <option value="exporter" selected>Exporter</option>
        <option value="importer">Importer</option>
      </select>
    </div>
    <div class="og-avatar-group" id="roster" aria-label="People in this session"></div>
    <button class="og-btn og-btn--secondary og-btn--sm" id="btn-connect">Connect Galaxy machine</button>
    <button class="og-btn og-btn--secondary og-btn--sm" id="btn-upload">Upload a scan</button>
    <input type="file" id="file-scan" accept="image/*" hidden>
    <button class="og-btn og-btn--secondary og-btn--sm" id="btn-share">Share session</button>
    <button class="og-btn og-btn--primary og-btn--sm" id="btn-run">Run shipment</button>
  </div>
</header>

<div class="og-shell og-shell--with-inspector">

  <aside class="og-rail" id="rail">
    <div class="og-rail__section">
      <p class="og-eyebrow">Shipment</p>
      <div class="og-stack-2" id="shipment-list"></div>
    </div>

    <div class="og-rail__section">
      <p class="og-eyebrow">Parties</p>
      <div class="og-stack-2" id="party-list"></div>
    </div>

    <div class="og-rail__section">
      <p class="og-eyebrow">Agents</p>
      <div class="og-stack-2" id="agent-list"></div>
    </div>

    <div class="og-rail__section app-rail-foot">
      <p class="og-eyebrow">System</p>
      <dl class="og-kv og-kv--rows" id="system-status"></dl>
    </div>
  </aside>

  <main class="og-main">
    <nav class="og-tabs" id="tabs" role="tablist">
      <button class="og-tab og-tab--active" role="tab" data-tab="overview">Overview</button>
      <button class="og-tab" role="tab" data-tab="inbox">Inbox<span class="og-tab__count" id="tabcount-inbox">0</span></button>
      <button class="og-tab" role="tab" data-tab="documents">Documents<span class="og-tab__count" id="tabcount-documents">0</span></button>
      <button class="og-tab" role="tab" data-tab="scan">Scan and cut</button>
      <button class="og-tab" role="tab" data-tab="compliance">Compliance</button>
      <button class="og-tab" role="tab" data-tab="price">Price</button>
      <button class="og-tab" role="tab" data-tab="statement">Statement</button>
      <button class="og-tab" role="tab" data-tab="audit">Audit</button>
      <button class="og-tab" role="tab" data-tab="model">Model</button>
    </nav>

    <div class="app-panels" id="panels">
      <section class="og-tabpanel is-active" data-panel="overview" id="panel-overview"></section>
      <section class="og-tabpanel" data-panel="inbox" id="panel-inbox"></section>
      <section class="og-tabpanel" data-panel="documents" id="panel-documents"></section>
      <section class="og-tabpanel" data-panel="scan" id="panel-scan"></section>
      <section class="og-tabpanel" data-panel="compliance" id="panel-compliance"></section>
      <section class="og-tabpanel" data-panel="price" id="panel-price"></section>
      <section class="og-tabpanel" data-panel="statement" id="panel-statement"></section>
      <section class="og-tabpanel" data-panel="audit" id="panel-audit"></section>
      <section class="og-tabpanel" data-panel="model" id="panel-model"></section>
    </div>
  </main>

  <aside class="og-inspector" id="inspector">
    <div class="og-inspector__header">
      <p class="og-inspector__title" id="inspector-title">Activity</p>
    </div>
    <div class="og-inspector__body" id="inspector-body">
      <div class="og-agent__log" id="activity-log"></div>
    </div>
    <div class="og-inspector__footer">
      <span class="og-t-11 og-c-tertiary" id="chain-head">Audit chain empty</span>
    </div>
  </aside>

</div>

<div class="app-film" id="film" hidden>
  <video id="film-video" playsinline muted preload="auto"></video>
  <p class="app-film__tag" id="film-tag">Galaxy machine, scanning the rough</p>
</div>

<div class="og-drawer" id="share-drawer" hidden>
  <div class="og-drawer__scrim" data-close="share"></div>
  <div class="og-drawer__panel">
    <div class="og-drawer__header">
      <p class="og-drawer__title">Share this session</p>
      <button class="og-btn og-btn--ghost og-btn--icon og-btn--sm" data-close="share" aria-label="Close">&times;</button>
    </div>
    <div class="og-drawer__body og-stack-4" id="share-body"></div>
  </div>
</div>



<script src="src/domain.js"></script>
<script src="src/mailbox.js"></script>
<script src="src/extract.js"></script>
<script src="src/rules.js"></script>
<script src="src/precut.js"></script>
<script src="src/quote.js"></script>
<script src="src/agents.js"></script>
<script src="src/audit.js"></script>
<script src="js/ocr.js"></script>
<script src="js/cv.js"></script>
<script src="js/planner.js"></script>
<script src="js/cnn.js"></script>
<script src="js/session.js"></script>
<script src="js/workspace.js"></script>
</body>
</html>
